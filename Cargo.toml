[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/wangmingfa/x"
authors = ["x contributors"]

[workspace.dependencies]
x-core = { path = "crates/x-core", version = "0.1.0" }
x-platform = { path = "crates/x-platform", version = "0.1.0" }
x-cli = { path = "crates/x-cli", version = "0.1.0" }
x-tui = { path = "crates/x-tui", version = "0.1.0" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
    "disk",
] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
